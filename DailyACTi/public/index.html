<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activity Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">Activity Tracker</h1>
                    </div>
                    <div class="flex items-center">
                        <span id="userEmail" class="hidden text-gray-600 mr-4"></span>
                        <button onclick="logout()" id="logoutBtn" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium">
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Registration Form -->
        <div>
            <h2>Register</h2>
            <form id="registerForm">
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <!-- Login Form -->
        <div>
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Activity Grid -->
        <div class="bg-white shadow-sm rounded-lg p-6 overflow-x-auto">
            <div id="grid" class="min-w-full">
                <!-- Grid will be populated by JavaScript -->
            </div>
        </div>
    </div>

        <!-- Authentication Container -->
        <div id="loginForm" class="max-w-md mx-auto mt-10 px-4 sm:px-6 lg:px-8">
            <div class="bg-white py-8 px-6 shadow rounded-lg sm:px-10">
                <h2 class="mb-6 text-2xl font-bold text-gray-900">Login/Register</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex space-x-4">
                        <button onclick="login()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md">Login</button>
                        <button onclick="register()" class="w-1/2 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md">Register</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
            <!-- Custom Activity Form -->
            <div class="bg-white shadow-sm rounded-lg p-6 mb-8">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Add Custom Activity</h3>
                <div class="flex space-x-4">
                    <input type="text" id="newActivity" placeholder="Activity name" 
                           class="flex-1 border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <button onclick="addCustomActivity()" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md">
                        Add Activity
                    </button>
                </div>
            </div>

            <!-- Activity Grid -->
            <div class="bg-white shadow-sm rounded-lg p-6 overflow-x-auto">
                <div id="grid" class="min-w-full">
                    <!-- Grid will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    <script src="js/firebase-config.js"></script>
    <script type="module"> 
       // Register User
       document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Registered successfully
                    const user = userCredential.user;
                    console.log('User registered:', user);
                })
                .catch((error) => {
                    console.error('Error registering user:', error);
                });
        });

        // Login User
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Logged in successfully
                    const user = userCredential.user;
                    console.log('User logged in:', user);
                })
                .catch((error) => {
                    console.error('Error logging in user:', error);
                });
        });

        // Logout User
        function logout() {
            signOut(auth).then(() => {
                console.log('User logged out');
            }).catch((error) => {
                console.error('Error logging out:', error);
            });
        }

        let currentUser = null;
        let activities = [
            "Body Exercising",
            "Reading Self-help Books",
            "Forex/Binary Trading",
            "IT Networking Skills",
            "Communication Skills",
            "Programming Practice",
            "Journaling",
            "Video Creation",
            "Daily Reflection",
            "Financial Literacy"
        ];

        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.className = 'grid gap-1';
            grid.style.gridTemplateColumns = `200px repeat(90, minmax(40px, 1fr))`;

            // Create date headers
            const headerRow = document.createElement('div');
            headerRow.className = 'contents';
            
            // Empty cell for activity names
            const emptyHeader = document.createElement('div');
            emptyHeader.className = 'bg-gray-100 p-2 font-semibold sticky left-0 z-10';
            headerRow.appendChild(emptyHeader);

            const today = new Date();
            for (let i = 0; i < 90; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const dateCell = document.createElement('div');
                dateCell.className = 'bg-gray-100 p-2 text-xs transform -rotate-45 origin-top-left h-16 flex items-start justify-center';
                dateCell.textContent = date.toLocaleDateString();
                headerRow.appendChild(dateCell);
            }
            grid.appendChild(headerRow);

            // Create activity rows
            activities.forEach(activity => {
                const row = document.createElement('div');
                row.className = 'contents';

                const nameCell = document.createElement('div');
                nameCell.className = 'bg-white p-2 sticky left-0 z-10 border-b border-gray-200';
                nameCell.textContent = activity;
                row.appendChild(nameCell);

                for (let i = 0; i < 90; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors duration-150 h-10 border border-gray-200';
                    cell.setAttribute('data-activity', activity);
                    cell.setAttribute('data-date', new Date(today.getTime() + i * 86400000).toISOString().split('T')[0]);
                    cell.onclick = () => toggleActivity(cell);
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            });

            loadUserData();
        }

        function toggleActivity(cell) {
            if (!currentUser) return;

            const activity = cell.getAttribute('data-activity');
            const date = cell.getAttribute('data-date');
            const completed = !cell.classList.contains('bg-green-500');

            db.collection('users').doc(currentUser.uid)
                .collection('activities').doc(`${date}-${activity}`)
                .set({
                    activity,
                    date,
                    completed,
                    timestamp: new Date()
                })
                .then(() => {
                    cell.classList.toggle('bg-green-500', completed);
                    cell.classList.toggle('bg-gray-50', !completed);
                    checkMissedActivities();
                });
        }

        function checkMissedActivities() {
            const today = new Date();
            const cells = document.querySelectorAll('[data-date]');
            cells.forEach(cell => {
                const cellDate = new Date(cell.getAttribute('data-date'));
                if (cellDate < today && !cell.classList.contains('bg-green-500')) {
                    cell.classList.remove('bg-gray-50');
                    cell.classList.add('bg-red-500');
                }
            });
        }

        function loadUserData() {
            if (!currentUser) return;

            db.collection('users').doc(currentUser.uid)
                .collection('activities')
                .get()
                .then(snapshot => {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const cell = document.querySelector(
                            `[data-activity="${data.activity}"][data-date="${data.date}"]`
                        );
                        if (cell && data.completed) {
                            cell.classList.remove('bg-gray-50');
                            cell.classList.add('bg-green-500');
                        }
                    });
                    checkMissedActivities();
                });
        }

        function addCustomActivity() {
            const newActivity = document.getElementById('newActivity').value.trim();
            if (newActivity && !activities.includes(newActivity)) {
                activities.push(newActivity);
                createGrid();
                document.getElementById('newActivity').value = '';
            }
        }

        // Authentication functions
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password)
                .catch(error => alert(error.message));
        }

        function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, password)
                .catch(error => alert(error.message));
        }

        function logout() {
            auth.signOut();
        }

        // Auth state observer
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userEmail').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                createGrid();
            } else {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('mainContent').classList.add('hidden');
                document.getElementById('userEmail').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
